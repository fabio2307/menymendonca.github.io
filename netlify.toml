[build]
publish = "public"

[functions."feeds-update"]
  schedule = "@hourly"

[[redirects]]
from = "/admin"
to = "/admin.html"
status = 301

[[redirects]]
from = "/login"
to = "/admin.html"
status = 301

# Endereço usado durante o desenvolvimento do layout novo
[[redirects]]
from = "/feed.html"
to = "/"
status = 301
force = true

# PWA: o service worker e o manifest nunca podem ficar presos em cache,
# senão o app instalado demora a receber atualizações.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "no-cache"

# Segurança: cabeçalhos para todas as páginas
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Painel admin: nunca em cache, nunca dentro de outro site (clickjacking),
# fora do Google
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
