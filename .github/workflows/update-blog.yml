name: Atualizar blog.json

on:
  schedule:
    - cron: '*/30 * * * *'   # a cada 30 minutos (ajuste se quiser mais/menos frequente)
  workflow_dispatch:          # permite rodar manualmente na aba "Actions" do GitHub

# Necessário para o Action poder dar "git push" de volta no repositório
permissions:
  contents: write

jobs:
  update-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install rss-parser

      - name: Rodar updateBlog.js
        run: node updateBlog.js

      - name: Commitar blog.json (só se algo mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog.json
          git diff --staged --quiet || git commit -m "chore: atualizar blog.json automaticamente"
          git push