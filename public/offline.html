<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07160f" />
  <title>Você está offline — Meny Mendonça</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      display: grid; place-items: center; text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #07160f; color: #ffffff;
      padding: calc(2rem + env(safe-area-inset-top)) 2rem calc(2rem + env(safe-area-inset-bottom));
    }
    .card { max-width: 26rem; }
    img { width: 5rem; height: 5rem; margin: 0 auto 1.5rem; border-radius: 1.2rem; display: block; }
    h1 { font-size: 1.4rem; margin: 0 0 .75rem; }
    p { color: #8fa89c; line-height: 1.6; margin: 0 0 1.5rem; }
    button {
      background: #00ffa9; color: #07160f; border: none; padding: .9rem 1.8rem;
      border-radius: .8rem; font-weight: 700; font-size: 1rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/assets/images/icons/icon-192.png" alt="Meny Mendonça" onerror="this.style.display='none'" />
    <h1>Você está sem conexão</h1>
    <p>Assim que a internet voltar, é só tentar de novo — vídeos, músicas, lives e agenda precisam de conexão para atualizar.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
