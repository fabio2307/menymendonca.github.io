backend:
  name: git-gateway
  branch: main

# Opcional para desenvolvimento local
local_backend: false

# Onde as imagens serão salvas
# IMPORTANTE: o site publicado é a pasta "public/" (ver netlify.toml:
# publish = "public"), então o caminho de gravação no repositório precisa
# do prefixo "public/" — sem ele, a imagem era commitada em
# assets/images/uploads (raiz do repo), fora da pasta publicada, e nunca
# aparecia no site.
media_folder: "public/assets/images/uploads"
public_folder: "/assets/images/uploads"

# Informações do site
site_url: https://menymendonca.netlify.app
display_url: https://menymendonca.netlify.app
logo_url: /assets/images/logo.png

# Remove preview (evita conflitos em site estático)
editor:
  preview: false

collections:
  - name: "momentos"
    label: "Momentos"
    files:
      - label: "Lista de Momentos"
        name: "momentos"
        # Idem: precisa do prefixo "public/" para cair dentro da pasta
        # que o Netlify realmente publica.
        file: "public/assets/data/momentos.json"
        format: "json"
        fields:
          - label: "Momentos"
            name: "items"
            widget: "list"
            summary: "{{fields.titulo}} — {{fields.categoria}}"
            fields:
              - label: "Título"
                name: "titulo"
                widget: "string"

              - label: "Categoria"
                name: "categoria"
                widget: "select"
                options:
                  - família
                  - passeio
                  - lives
                  - inesquecíveis
                  - amigos
                  - viagens
                  - diversos

              - label: "Imagem"
                name: "imagem"
                widget: "image"

  - name: "tiktok"
    label: "TikTok"
    files:
      - label: "Vídeos TikTok"
        name: "tiktok"
        file: "public/assets/data/tiktok-manual.json"
        format: "json"
        fields:
          - label: "Vídeos"
            name: "videos"
            widget: "list"
            summary: "{{fields.titulo}} — {{fields.url}}"
            fields:
              - label: "Link do vídeo"
                name: "url"
                widget: "string"
                hint: "Cole o link completo do TikTok (ex: https://www.tiktok.com/@usuario/video/1234567890)"
                pattern: ['^https:\/\/(www\.)?tiktok\.com\/.+', "Cole um link válido do TikTok (precisa começar com https://www.tiktok.com/)"]

              - label: "Título (opcional)"
                name: "titulo"
                widget: "string"
                required: false