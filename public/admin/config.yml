backend:
  name: git-gateway
  branch: main

# Opcional para desenvolvimento local
local_backend: false

# Onde as imagens serão salvas
media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

# Informações do site
display_url: https://menymendonca.netlify.app
logo_url: /assets/images/logo.png

# Remove preview (evita conflitos em site estático)
editor:
  preview: false

collections:
  - name: "momentos"
    label: "Momentos"
    files:
      - label: "Lista de Momentos"
        name: "momentos"
        file: "assets/data/momentos.json"
        format: "json"
        fields:
          - label: "Momentos"
            name: "items"
            widget: "list"
            # itens começam fechados: em telas pequenas evita renderizar
            # imagem + select + texto de todos os momentos ao mesmo tempo
            collapsed: true
            summary: "{{fields.titulo}} — {{fields.categoria}}"
            fields:
              - label: "Título"
                name: "titulo"
                widget: "string"

              - label: "Categoria"
                name: "categoria"
                widget: "select"
                options:
                  - família
                  - passeio
                  - lives
                  - inesquecíveis
                  - amigos
                  - viagens
                  - diversos

              - label: "Imagem"
                name: "imagem"
                widget: "image"

  - name: "tiktok"
    label: "TikTok"
    files:
      - label: "Vídeos TikTok"
        name: "tiktok"
        file: "tiktok-manual.json"
        format: "json"
        fields:
          - label: "Vídeos"
            name: "videos"
            widget: "list"
            collapsed: true
            # resumo só com o título: a URL completa do TikTok é longa
            # e estourava a linha de resumo (com os ícones de ação) em mobile
            summary: "{{fields.titulo}}"
            fields:
              - label: "Link do vídeo"
                name: "url"
                widget: "string"
                hint: "Cole o link completo do TikTok (ex: https://www.tiktok.com/@usuario/video/1234567890)"

              - label: "Título (opcional)"
                name: "titulo"
                widget: "string"
                required: false