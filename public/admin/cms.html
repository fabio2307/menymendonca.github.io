<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <title>CMS — Meny Mendonça</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="cms-config-url" href="./config.yml" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        :root {
            color-scheme: dark;
            --bg-1: #0a140f;
            --bg-2: #0d1f15;
            --panel: #101f17;
            --border: rgba(212, 162, 76, 0.26);
            --border-soft: rgba(212, 162, 76, 0.14);
            --brass: #d4a24c;
            --brass-soft: #e9c877;
            --emerald: #34c793;
            --text: #f3efe3;
            --muted: #93a89b;
            --danger: #ff9d8a;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            overflow-x: hidden;
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Work Sans', sans-serif;
            background:
                radial-gradient(circle at 12% 8%, rgba(212, 162, 76, 0.10), transparent 32%),
                radial-gradient(circle at 88% 92%, rgba(52, 199, 147, 0.10), transparent 30%),
                linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-1) 100%);
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 2rem;
        }

        /* ---------- Badge card ---------- */

        .badge {
            position: relative;
            width: min(100%, 27rem);
            padding: 3.1rem 2.6rem 2.4rem;
            border-radius: 1.4rem;
            background: var(--panel);
            border: 1px solid var(--border-soft);
            box-shadow:
                0 40px 90px rgba(0, 0, 0, 0.38),
                0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            text-align: center;
        }

        .badge__hole {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--bg-1);
            border: 1px solid var(--border);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .badge__serial {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        .eyebrow {
            display: inline-block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--brass-soft);
            margin-top: 0.6rem;
        }

        h1 {
            margin: 0.9rem 0 0;
            font-family: 'Fraunces', serif;
            font-weight: 500;
            font-size: clamp(1.7rem, 3.4vw, 2.15rem);
            line-height: 1.18;
            letter-spacing: -0.01em;
        }

        p {
            margin: 0.9rem 0 0;
            line-height: 1.7;
            color: var(--muted);
            font-size: 1rem;
            max-width: 22rem;
            margin-left: auto;
            margin-right: auto;
        }

        /* ticket-style perforation divider */
        .badge__perf {
            position: relative;
            height: 1px;
            margin: 1.9rem -2.6rem 1.7rem;
            background-image: repeating-linear-gradient(to right, var(--border) 0 7px, transparent 7px 14px);
        }

        .badge__perf::before,
        .badge__perf::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--bg-1);
            transform: translateY(-50%);
        }

        .badge__perf::before {
            left: -10px;
        }

        .badge__perf::after {
            right: -10px;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: stretch;
        }

        button,
        .link-btn {
            width: 100%;
            padding: 0.95rem 1.4rem;
            border: none;
            border-radius: 0.7rem;
            font-family: 'Work Sans', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        button:hover,
        .link-btn:hover {
            transform: translateY(-1px);
        }

        button:focus-visible,
        .link-btn:focus-visible {
            outline: 2px solid var(--brass-soft);
            outline-offset: 2px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--brass-soft), var(--brass) 70%);
            color: #241705;
            position: relative;
            overflow: hidden;
            box-shadow: 0 14px 32px rgba(212, 162, 76, 0.18);
        }

        .btn-primary:hover {
            filter: brightness(1.05);
        }

        .btn-primary.loading {
            color: rgba(36, 23, 5, 0.7);
            pointer-events: none;
            box-shadow: 0 10px 24px rgba(212, 162, 76, 0.12);
        }

        .btn-primary.loading::after {
            content: "";
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(36, 23, 5, 0.25);
            border-top-color: rgba(36, 23, 5, 0.85);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-secondary {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border-soft);
        }

        .btn-secondary:hover {
            color: var(--text);
            border-color: var(--border);
        }

        /* ---------- Status readout ---------- */

        .status {
            margin-top: 1.6rem;
            padding: 0.85rem 1.1rem;
            border-radius: 0.7rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-soft);
            color: var(--muted);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            text-align: left;
        }

        .status__dot {
            flex: none;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--muted);
        }

        .status--error {
            border-color: rgba(255, 157, 138, 0.35);
            color: var(--danger);
        }

        .status--error .status__dot {
            background: var(--danger);
        }

        .status--success {
            border-color: rgba(52, 199, 147, 0.35);
            color: #bdf3dc;
        }

        .status--success .status__dot {
            background: var(--emerald);
            box-shadow: 0 0 0 3px rgba(52, 199, 147, 0.18);
        }

        #nc-root,
        .nc-root,
        .css-1ff92bv-SidebarContainer-card-card {
            width: 100% !important;
            max-width: 100% !important;
            min-width: 0 !important;
            position: static !important;
            top: auto !important;
            left: auto !important;
            transform: none !important;
            z-index: auto !important;
            overflow: visible !important;
        }

        @media (max-width: 640px) {
            body {
                padding: 1.1rem;
            }

            .badge {
                width: 100%;
                padding: 2.6rem 1.5rem 1.9rem;
                border-radius: 1.1rem;
            }

            .badge__perf {
                margin-left: -1.5rem;
                margin-right: -1.5rem;
            }

            .status {
                font-size: 0.76rem;
            }
        }
    </style>
</head>

<body>
    <main class="badge" id="access-card">
        <div class="badge__hole" aria-hidden="true"></div>
        <span class="badge__serial">Nº MM–07</span>
        <span class="eyebrow">Meny Mendonça · CMS</span>
        <h1>Sua credencial para editar</h1>
        <p>Entre com sua conta Netlify para validar o acesso e abrir o editor do site.</p>
        <div class="badge__perf" aria-hidden="true"></div>
        <div class="actions">
            <button class="btn-primary" id="btnEntrar" type="button">Entrar com Netlify</button>
            <a class="link-btn btn-secondary" href="/admin.html">Voltar ao painel admin</a>
        </div>
        <div id="status" class="status">
            <span class="status__dot" aria-hidden="true"></span>
            <span class="status__text">Aguardando ação de login…</span>
        </div>
    </main>

    <script>
        (function () {
            var card = document.getElementById("access-card");
            var statusEl = null;

            function renderCard(titulo, descricao, mostrarBotao, statusTexto) {
                card.innerHTML = [
                    '<div class="badge__hole" aria-hidden="true"></div>',
                    '<span class="badge__serial">Nº MM–07</span>',
                    '<span class="eyebrow">Meny Mendonça · CMS</span>',
                    '<h1>' + titulo + '</h1>',
                    '<p>' + descricao + '</p>',
                    '<div class="badge__perf" aria-hidden="true"></div>',
                    mostrarBotao
                        ? '<div class="actions"><button class="btn-primary" id="btnEntrar" type="button">Entrar com Netlify</button><a class="link-btn btn-secondary" href="/admin.html">Voltar ao painel admin</a></div>'
                        : '',
                    '<div id="status" class="status"><span class="status__dot" aria-hidden="true"></span><span class="status__text">' + (statusTexto || '') + '</span></div>'
                ].join('');

                var novoBotao = document.getElementById("btnEntrar");
                if (novoBotao) {
                    novoBotao.addEventListener("click", abrirLogin);
                }

                statusEl = document.getElementById('status');
            }

            function setStatus(text, type) {
                if (!statusEl) return;
                var textEl = statusEl.querySelector('.status__text');
                if (textEl) textEl.textContent = text;
                statusEl.className = 'status';
                if (type === 'error') statusEl.classList.add('status--error');
                if (type === 'success') statusEl.classList.add('status--success');
            }

            function setButtonLoading(loading) {
                var btn = document.getElementById('btnEntrar');
                if (!btn) return;
                if (loading) {
                    btn.classList.add('loading');
                    btn.textContent = 'Abrindo login...';
                    btn.disabled = true;
                } else {
                    btn.classList.remove('loading');
                    btn.textContent = 'Entrar com Netlify';
                    btn.disabled = false;
                }
            }

            function irParaAdmin() {
                window.location.replace("/admin.html");
            }

            function carregarCMS() {
                if (document.getElementById("decap-cms-script")) return;
                var script = document.createElement("script");
                script.id = "decap-cms-script";
                script.src = "https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js";
                document.body.appendChild(script);
            }

            function abrirLogin() {
                if (!window.netlifyIdentity) {
                    renderCard("Acesso indisponível", "O widget de autenticação não carregou. Recarregue a página e tente novamente.", true, 'O widget de login não está disponível.');
                    return;
                }
                setButtonLoading(true);
                setStatus('Abrindo painel de login...', null);
                window.netlifyIdentity.open("login");
            }

            if (!window.netlifyIdentity) {
                renderCard("Acesso indisponível", "O widget de autenticação não carregou. Recarregue a página e tente novamente.", true, 'O widget de login não está disponível.');
                return;
            }

            statusEl = document.getElementById('status');
            document.getElementById('btnEntrar').addEventListener('click', abrirLogin);

            var usuario = window.netlifyIdentity.currentUser();
            if (usuario) {
                carregarCMS();
                renderCard("Credencial validada", "Aguarde enquanto o editor é inicializado.", false, 'Autenticado. Carregando editor…');
            } else {
                renderCard("Sua credencial para editar", "Entre com sua conta Netlify para validar o acesso e abrir o editor do site.", true, 'Aguardando ação de login…');
            }

            window.netlifyIdentity.on("init", function (user) {
                if (user) {
                    carregarCMS();
                    renderCard("Credencial validada", "Aguarde enquanto o editor é inicializado.", false, 'Autenticado. Carregando editor…');
                } else {
                    renderCard("Sua credencial para editar", "Entre com sua conta Netlify para validar o acesso e abrir o editor do site.", true, 'Aguardando ação de login…');
                }
                setButtonLoading(false);
            });

            window.netlifyIdentity.on("login", function () {
                setStatus('Login realizado. Carregando CMS…', 'success');
                setButtonLoading(false);
                carregarCMS();
                window.netlifyIdentity.close();
            });

            window.netlifyIdentity.on("close", function () {
                setButtonLoading(false);
                setStatus('Login cancelado. Tente novamente ou feche o popup.', 'error');
            });

            window.netlifyIdentity.on("logout", irParaAdmin);

            window.netlifyIdentity.init();
        })();
    </script>
</body>

</html>
