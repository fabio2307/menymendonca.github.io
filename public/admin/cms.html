<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <title>CMS — Meny Mendonça</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="cms-config-url" href="./config.yml" />
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        :root {
            color-scheme: dark;
            --bg: #07160f;
            --panel: rgba(10, 24, 17, 0.95);
            --border: rgba(0, 255, 169, 0.24);
            --text: #f4fff9;
            --muted: #9db6ad;
            --accent: #00FFA9;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top left, rgba(0, 255, 169, 0.12), transparent 25%),
                        radial-gradient(circle at bottom right, rgba(0, 255, 169, 0.08), transparent 20%),
                        linear-gradient(135deg, #06120d 0%, #091f13 48%, #071611 100%);
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 2rem;
        }

        .card {
            width: min(100%, 44rem);
            padding: clamp(2.2rem, 2.8vw, 3.4rem);
            border-radius: 2rem;
            background: rgba(8, 21, 17, 0.96);
            border: 1px solid rgba(0, 255, 169, 0.14);
            box-shadow: 0 40px 90px rgba(0, 0, 0, 0.28);
            text-align: center;
            backdrop-filter: blur(18px);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top left, rgba(0, 255, 169, 0.1), transparent 32%);
            pointer-events: none;
        }

        .eyebrow {
            display: inline-block;
            font-size: 0.95rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 1rem;
            position: relative;
            z-index: 1;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.4rem, 3vw, 3.4rem);
            line-height: 1.05;
            position: relative;
            z-index: 1;
        }

        p {
            margin: 0;
            margin-top: 1rem;
            line-height: 1.85;
            color: var(--muted);
            font-size: 1.22rem;
            max-width: 40rem;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            z-index: 1;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2.2rem;
            align-items: center;
            justify-content: center;
        }

        .actions .link-btn {
            width: auto;
            min-width: 16rem;
        }

        .actions button,
        .actions .link-btn {
            min-width: 16rem;
        }

        button,
        .link-btn {
            width: 100%;
            padding: 1.15rem 1.6rem;
            border: none;
            border-radius: 999px;
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        button:hover,
        .link-btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #00ffa9, #4cffb2 55%, #00d89a);
            color: #042117;
            position: relative;
            overflow: hidden;
            box-shadow: 0 14px 40px rgba(0, 255, 169, 0.18);
        }

        .btn-primary.loading {
            color: rgba(4, 33, 23, 0.75);
            pointer-events: none;
            box-shadow: 0 10px 28px rgba(0, 255, 169, 0.12);
        }

        .btn-primary.loading::after {
            content: "";
            position: absolute;
            right: 1.4rem;
            top: 50%;
            width: 1.05rem;
            height: 1.05rem;
            border: 2px solid rgba(4, 33, 23, 0.25);
            border-top-color: rgba(4, 33, 23, 0.85);
            border-radius: 50%;
            transform: translateY(-50%);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: translateY(-50%) rotate(0deg); }
            100% { transform: translateY(-50%) rotate(360deg); }
        }

        .btn-secondary {
            background: rgba(255,255,255,0.08);
            color: var(--text);
            border: 1px solid rgba(255,255,255,0.16);
        }

        .status {
            margin-top: 1.8rem;
            padding: 1rem 1.25rem;
            border-radius: 1.2rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--muted);
            font-size: 1.2rem;
            min-height: 4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .status--error {
            border-color: rgba(255, 91, 91, 0.35);
            background: rgba(255, 91, 91, 0.08);
            color: #ffb5b5;
        }

        .status--success {
            border-color: rgba(0, 255, 169, 0.28);
            background: rgba(0, 255, 169, 0.08);
            color: #d0ffe6;
        }

        html,
        body {
            overflow-x: hidden;
            min-height: 100%;
        }

        .card {
            max-width: min(100%, 44rem);
            width: min(100%, 44rem);
            padding: clamp(1.8rem, 4vw, 3.4rem);
        }

        #nc-root,
        .nc-root,
        .css-1ff92bv-SidebarContainer-card-card {
            width: 100% !important;
            max-width: 100% !important;
            min-width: 0 !important;
            position: static !important;
            top: auto !important;
            left: auto !important;
            transform: none !important;
            z-index: auto !important;
            overflow: visible !important;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }

            .card {
                width: 100%;
                padding: 1.4rem 1.2rem;
                border-radius: 1.5rem;
            }

            .actions .link-btn {
                min-width: 0;
            }

            button,
            .link-btn {
                font-size: 1rem;
                padding: 1rem 1.2rem;
            }

            .status {
                font-size: 1rem;
                min-height: auto;
            }
        }
    </style>
</head>

<body>
    <main class="card" id="access-card">
        <span class="eyebrow">CMS</span>
        <h1>Editor seguro em nuvem</h1>
        <p>Entre com sua conta Netlify para abrir o CMS e editar conteúdo com segurança. Se preferir, volte ao painel administrativo.</p>
        <div class="actions">
            <button class="btn-primary" id="btnEntrar" type="button">Entrar com Netlify</button>
            <a class="link-btn btn-secondary" href="/admin.html">Voltar ao painel admin</a>
        </div>
        <div id="status" class="status">Aguardando ação de login...</div>
    </main>

    <script>
        (function () {
            var card = document.getElementById("access-card");
            var btnEntrar = document.getElementById("btnEntrar");

            var statusEl = null;

            function mostrarMensagem(titulo, descricao, mostrarBotao, statusTexto) {
                card.innerHTML = [
                    '<span class="eyebrow">CMS</span>',
                    '<h1>' + titulo + '</h1>',
                    '<p>' + descricao + '</p>',
                    mostrarBotao ? '<div class="actions"><button class="btn-primary" id="btnEntrar" type="button">Entrar com Netlify</button><a class="link-btn btn-secondary" href="/admin.html">Voltar ao painel admin</a></div>' : '',
                    '<div id="status" class="status">' + (statusTexto || '') + '</div>'
                ].join('');

                var novoBotao = document.getElementById("btnEntrar");
                if (novoBotao) {
                    novoBotao.addEventListener("click", abrirLogin);
                }

                statusEl = document.getElementById('status');
            }

            function setStatus(text, type) {
                if (!statusEl) return;
                statusEl.textContent = text;
                statusEl.className = 'status';
                if (type === 'error') statusEl.classList.add('status--error');
                if (type === 'success') statusEl.classList.add('status--success');
            }

            function setButtonLoading(loading) {
                var btn = document.getElementById('btnEntrar');
                if (!btn) return;
                if (loading) {
                    btn.classList.add('loading');
                    btn.textContent = 'Abrindo login...';
                    btn.disabled = true;
                } else {
                    btn.classList.remove('loading');
                    btn.textContent = 'Entrar com Netlify';
                    btn.disabled = false;
                }
            }

            function irParaAdmin() {
                window.location.replace("/admin.html");
            }

            function carregarCMS() {
                if (document.getElementById("decap-cms-script")) return;
                var script = document.createElement("script");
                script.id = "decap-cms-script";
                script.src = "https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js";
                document.body.appendChild(script);
            }

            function abrirLogin() {
                if (!window.netlifyIdentity) {
                    mostrarMensagem("Acesso indisponível", "O widget de autenticação não carregou. Recarregue a página e tente novamente.", true, 'O widget de login não está disponível.');
                    return;
                }
                setButtonLoading(true);
                setStatus('Abrindo painel de login...', null);
                window.netlifyIdentity.open("login");
            }

            if (!window.netlifyIdentity) {
                mostrarMensagem("Acesso indisponível", "O widget de autenticação não carregou. Recarregue a página e tente novamente.", true);
                return;
            }

            var usuario = window.netlifyIdentity.currentUser();
            if (usuario) {
                carregarCMS();
                mostrarMensagem("CMS carregando", "Aguarde enquanto o editor é inicializado.", false, 'Autenticado. Carregando editor...');
            } else {
                mostrarMensagem("Autenticação necessária", "Entre com sua conta para abrir o CMS.", true, 'Faça login para continuar.');
            }

            window.netlifyIdentity.on("init", function (user) {
                if (user) {
                    carregarCMS();
                    mostrarMensagem("CMS carregando", "Aguarde enquanto o editor é inicializado.", false, 'Autenticado. Carregando editor...');
                } else {
                    mostrarMensagem("Autenticação necessária", "Entre com sua conta para abrir o CMS.", true, 'Faça login para continuar.');
                }
                setButtonLoading(false);
            });

            window.netlifyIdentity.on("login", function () {
                setStatus('Login realizado. Carregando CMS...', 'success');
                setButtonLoading(false);
                carregarCMS();
                window.netlifyIdentity.close();
            });

            window.netlifyIdentity.on("close", function () {
                setButtonLoading(false);
                setStatus('Login cancelado. Tente novamente ou feche o popup.', 'error');
            });

            window.netlifyIdentity.on("logout", irParaAdmin);

            window.netlifyIdentity.init();
        })();
    </script>
</body>
</html>
