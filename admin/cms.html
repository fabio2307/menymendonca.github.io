<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <title>CMS — Meny Mendonça</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>

<body>

    <script>
        (function () {
            function irParaAdmin() {
                window.location.replace("/admin/");
            }

            function carregarCMS() {
                if (document.getElementById("decap-cms-script")) return;
                var script = document.createElement("script");
                script.id = "decap-cms-script";
                script.src = "https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js";
                document.body.appendChild(script);
            }

            if (!window.netlifyIdentity) {
                irParaAdmin();
                return;
            }

            // Verifica imediatamente, sem depender só do evento "init"
            // (que pode já ter disparado antes deste script rodar).
           /* var usuario = window.netlifyIdentity.currentUser();
            if (usuario) {
                carregarCMS();
            } else {
                pedirLogin();
            }*/

            window.netlifyIdentity.on("init", user => {
                if (usuario) {
                    carregarCMS();
                } else {
                    pedirLogin();
                }
            });

            window.netlifyIdentity.on("logout", irParaAdmin);
        })();
    </script>

</body>

</html>
