<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body>
  <div id="nc-root"></div>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <script>
    (function () {
      function carregarCMS() {
        if (document.getElementById("decap-cms-script")) return;
        var script = document.createElement("script");
        script.id = "decap-cms-script";
        script.src = "https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js";
        document.body.appendChild(script);
      }

      function pedirLogin() {
        // Abre o modal de login do proprio Netlify Identity, em vez de
        // redirecionar para uma pagina "/login/" que nao existe no site
        // (isso e o que causava o erro 404 "Pagina nao encontrada").
        window.netlifyIdentity.open("login");
      }

      if (!window.netlifyIdentity) {
        document.getElementById("nc-root").innerHTML =
          "<p style='font-family:sans-serif;text-align:center;margin-top:80px'>" +
          "Nao foi possivel carregar o sistema de login. Recarregue a pagina." +
          "</p>";
        return;
      }

      // Verifica imediatamente, sem depender so do evento "init"
      // (que pode ja ter disparado antes deste script rodar).
      var usuario = window.netlifyIdentity.currentUser();

      /*if (usuario) {
        carregarCMS();
      } else {
        pedirLogin();
      }*/

      window.netlifyIdentity.on("init", function (user) {
        if (user) {
          carregarCMS();
        } else {
          pedirLogin();
        }
      });

      // Quando o login e concluido no modal, libera o CMS.
      window.netlifyIdentity.on("login", function () {
        carregarCMS();
        window.netlifyIdentity.close();
      });

      window.netlifyIdentity.on("logout", function () {
        window.location.reload();
      });
    })();
  </script>
</body>

</html>
