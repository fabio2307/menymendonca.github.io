<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Painel TikTok</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Netlify Identity -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a1711;
            color: white;
            padding: 40px;
            max-width: 800px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #00FFA9;
        }

        textarea {
            width: 100%;
            height: 150px;
            margin-top: 20px;
            padding: 10px;
            border-radius: 10px;
            border: none;
        }

        button {
            margin-top: 15px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .salvar {
            background: #00FFA9;
            color: black;
        }

        .logout {
            background: red;
            color: white;
            float: right;
        }

        .status {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <button class="logout" onclick="logout()">Sair</button>

    <h1>Painel TikTok</h1>

    <p>Cole os links (um por linha):</p>

    <textarea id="links"></textarea>

    <button class="salvar" onclick="salvar()">Salvar</button>

    <div class="status" id="status"></div>

    <!-- 🔐 PROTEÇÃO DE LOGIN (CORRETA) -->
    <script>
        if (window.netlifyIdentity) {

            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.location.href = "/admin/index.html";
                }
            });

        }
    </script>

    <!-- 🚪 LOGOUT -->
    <script>
        function logout() {
            netlifyIdentity.logout();
        }

        window.netlifyIdentity.on("logout", () => {
            window.location.href = "/";
        });
    </script>

    <!-- 💾 SALVAR LINKS (exemplo localStorage) -->
    <script>

        const textarea = document.getElementById("links");
        const status = document.getElementById("status");


        function converterParaJSON(texto) {

            const linhas = texto
                .split("\n")
                .map(link =>
                    link
                        .trim()
                        .split("?")[0]
                )
                .filter(Boolean);

            return {

                videos: linhas.map(link => ({

                    url: link

                }))

            };
        }



        async function salvar() {

            const json = converterParaJSON(textarea.value);

            status.innerHTML = "Salvando...";

            try {

                const resposta = await fetch(
                    "/.netlify/functions/salvar-tiktok",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(json)
                    }
                );

                const resultado = await resposta.json();

                if (resultado.success) {

                    status.innerHTML =
                        "Links salvos no JSON ✅";

                } else {
                    status.innerHTML =
                        "Erro ao salvar ❌";

                }

            } catch (error) {


                console.error(error);

                status.innerHTML =
                    "Erro de conexão ❌";

            }

        }
        // carregar JSON existente

        window.addEventListener(
            "DOMContentLoaded",
            async () => {

                try {

                    const resposta =
                        await fetch("/tiktok-manual.json?cache=" + Date.now());

                    const dados =
                        await resposta.json();

                    if (dados.videos) {

                        textarea.value =
                            dados.videos
                                .map(video => video.url)
                                .join("\n");

                    }

                } catch (error) {

                    console.log(
                        "Nenhum JSON encontrado"
                    );
                }

            });
    </script>

</body>

</html>
