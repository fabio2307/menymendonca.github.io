backend:
  name: git-gateway
  branch: main

# Opcional para desenvolvimento local
local_backend: false

# Onde as imagens serão salvas
media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

# Informações do site
display_url: https://menymendonca.netlify.app
logo_url: /assets/images/logo.png

# Remove preview (evita conflitos em site estático)
editor:
  preview: false

collections:
  - name: "momentos"
    label: "Momentos"
    files:
      - label: "Lista de Momentos"
        name: "momentos"
        file: "assets/data/momentos.json"
        format: "json"
        fields:
          - label: "Momentos"
            name: "items"
            widget: "list"
            fields:
              - label: "Título"
                name: "titulo"
                widget: "string"

              - label: "Categoria"
                name: "categoria"
                widget: "select"
                options:
                  - família
                  - passeio
                  - lives
                  - inesquecíveis
                  - amigos
                  - viagens
                  - diversos

              - label: "Imagem"
                name: "imagem"
                widget: "image"